[package]
name = "picaso"
version = "0.1.6"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = { version = "5", features = ["shellexecute-on-windows"] }
picaso-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
rfd = "0.15"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[features]
fixture-provider = ["picaso-core/fixture-provider"]
