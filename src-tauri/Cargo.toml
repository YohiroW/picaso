[package]
name = "picaso"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
