version = 1
name = "Picaso"

[setup]
script = "npm ci"

[[actions]]
name = "Launch Picaso"
icon = "run"
platform = "darwin"
command = '''
app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Picaso.app"
if [ ! -d "$app" ]; then
  echo "Run 'Build and Launch Picaso' to create the app first." >&2
  exit 1
fi
open "$app"
'''

[[actions]]
name = "Build and Launch Picaso"
icon = "run"
platform = "darwin"
command = '''
npm run tauri -- build --target aarch64-apple-darwin --bundles app &&
  open "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Picaso.app"
'''
